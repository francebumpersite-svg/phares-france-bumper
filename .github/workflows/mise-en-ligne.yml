# Met l'appli en ligne : base de données + fonctions serveur (Supabase) + site (GitHub Pages)
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          manque=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SHOPIFY_SHOP SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET; do
            [ -z "${!s}" ] && manque="$manque $s"
          done
          if [ -n "$manque" ]; then echo "::error::Secrets manquants :$manque"; exit 1; fi
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Base de données
        run: |
          supabase link --project-ref "$REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"

      - name: Accès Shopify (lecture seule)
        run: |
          supabase secrets set --project-ref "$REF" \
            SHOPIFY_SHOP="$SHOPIFY_SHOP" \
            SHOPIFY_CLIENT_ID="$SHOPIFY_CLIENT_ID" \
            SHOPIFY_CLIENT_SECRET="$SHOPIFY_CLIENT_SECRET"
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

      - name: Fonctions serveur
        run: supabase functions deploy --project-ref "$REF" --use-api

      - name: Clé publique de l'appli
        id: cle
        run: |
          supabase projects api-keys --project-ref "$REF" -o json > cles.json
          KEY=$(jq -r '([.[] | select(.type=="publishable")][0].api_key) // ([.[] | select(.name=="anon")][0].api_key) // empty' cles.json)
          rm cles.json
          if [ -z "$KEY" ]; then echo "::error::Clé publique introuvable"; exit 1; fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Construction du site
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ steps.cle.outputs.key }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
